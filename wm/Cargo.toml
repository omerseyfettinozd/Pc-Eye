[package]
name = "pc-eye-wm"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "pc-eye-wm"
path = "src/main.rs"

[dependencies]
smithay = { version = "0.7.0", default-features = false, features = ["wayland_frontend", "desktop"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
